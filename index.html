<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Возврат МИ в ЛУ · ГрандМедТех</title>

<link rel="icon" href="https://mironov62-svg.github.io/SID_DSH/assets/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700%7CPoppins:400,500,600,700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --phone: #ffad00;
    --violet: #9e43fa;
    --violet-2: #a044ff;
    --success: #459647;
    --bg: #101010;
    --bg-panel: rgba(0, 0, 0, 0.45);
    --bg-panel-2: #17151c;
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.78);
    --text-muted: rgba(255, 255, 255, 0.55);
    --border: rgba(255, 255, 255, 0.12);
    --radius-xl: 15px;
    --radius-md: 8px;
    --radius-lg: 10px;

    --grad-header: linear-gradient(272deg, rgb(84, 99, 130) 0%, rgb(92, 66, 131) 98%);
    --grad-btn: linear-gradient(to right, #6a3093 0%, #a044ff 51%, #6a3093 100%);
    --grad-stepper: linear-gradient(135deg, #6a3093 0%, #a044ff 100%);

    --box-glow: rgb(119 54 222) -1px 11px 35px -20px, rgb(152 62 212) 1px 1px 20px -30px;
    --transition: all 0.3s ease;
  }

  body {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 14px;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(106, 48, 147, 0.4) 0%, transparent 60%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 15px 20px;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    backdrop-filter: blur(10px);
    box-shadow: var(--box-glow);
    overflow: visible;
  }

  /* ШАПКА — сжата по горизонтали, всегда одна строка */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    background: var(--grad-header);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    flex-wrap: nowrap;
    white-space: nowrap;
  }

  .site-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    min-width: 0;
    flex-shrink: 1;
  }

  .site-logo img {
    height: 30px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }

  .site-logo-text {
    min-width: 0;
    overflow: hidden;
  }

  .site-logo-text b {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    display: block;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .site-logo-text span {
    font-size: 9px;
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  .site-contacts {
    text-align: right;
    flex-shrink: 0;
  }

  .site-contacts a {
    display: block;
    text-decoration: none;
    color: #fff;
    line-height: 1.15;
    white-space: nowrap;
  }

  .site-phone {
    color: var(--phone);
    font-weight: 600;
    font-size: 12px;
  }

  .site-mail {
    font-size: 10px;
    opacity: 0.9;
  }

  /* ЗАГОЛОВОК */
  .header-block {
    padding: 12px 20px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .header-block h2 {
    font-size: 19px;
    margin-bottom: 4px;
    color: #fff;
    font-weight: 600;
  }

  .header-block p {
    font-size: 11.5px;
    color: var(--text-soft);
    line-height: 1.3;
    max-width: 600px;
    margin: 0 auto;
  }

  .content { padding: 18px 24px 24px; }

  /* ФОРМА */
  .form-section {
    margin-bottom: 14px;
    padding: 14px 18px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
  }

  .form-section h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }

  label {
    display: block;
    font-weight: 500;
    margin: 8px 0 5px;
    font-size: 12px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 9px 12px;
    background: #fff;
    border: 1px solid rgba(158, 67, 250, 0.3);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: #333;
    font-family: 'Montserrat', Arial, sans-serif;
    transition: var(--transition);
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--violet);
    box-shadow: 0 0 0 2px rgba(158, 67, 250, 0.2);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  /* КНОПКИ — единый стиль */
  .button-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-lg);
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.4px;
    transition: var(--transition);
    font-family: 'Montserrat', Arial, sans-serif;
    background: var(--grad-btn);
    background-size: 200%;
    color: white;
    box-shadow: 0 4px 15px rgba(160, 68, 255, 0.3);
  }

  button:hover:not(:disabled) { background-position: right; }

  button:disabled { opacity: 0.6; cursor: not-allowed; }

  #info {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  /* Сетка превью */
  #previews {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .thumb {
    position: relative;
    padding-top: 100%;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: #222;
    border: 1px solid var(--border);
  }
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .del {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 14px;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    flex: none;
    text-transform: none;
    letter-spacing: 0;
    box-shadow: none;
  }
  .thumb .del:hover { background: rgba(0,0,0,0.9); }

  #status {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    display: none;
    white-space: pre-wrap;
    border: 1px solid transparent;
  }
  .ok {
    background: rgba(69, 150, 71, 0.15);
    color: #a8e6b0;
    border-color: rgba(69, 150, 71, 0.5);
  }
  .err {
    background: rgba(220, 53, 69, 0.12);
    color: #ff9ea8;
    border-color: rgba(220, 53, 69, 0.5);
  }

  /* АДАПТИВ */
  @media (max-width: 600px) {
    .site-header {
      flex-direction: row;
      text-align: left;
      padding: 6px 10px;
      gap: 6px;
    }

    .site-logo img { height: 26px; }
    .site-logo-text b { font-size: 11px; }
    .site-logo-text span { display: none; }

    .site-phone { font-size: 11px; }
    .site-mail { font-size: 9px; }

    .content { padding: 14px 16px 20px; }
    .form-section { padding: 12px 14px; }
  }

  @media (max-width: 380px) {
    .site-logo-text b { font-size: 10px; }
    .site-phone { font-size: 10px; }
    .site-mail { font-size: 8px; }
    .site-logo img { height: 22px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="container">

    <!-- ШАПКА -->
    <header class="site-header">
      <a class="site-logo" href="https://grandmedtech.ru/" target="_blank">
        <img src="https://mironov62-svg.github.io/SID_DSH/assets/logo.png" alt="ГрандМедТех">
        <div class="site-logo-text">
          <b>ГрандМедТех</b>
          <span>Сервис медтехники</span>
        </div>
      </a>
      <div class="site-contacts">
        <a class="site-phone" href="tel:+73833110232">8 (383) 311-02-32</a>
        <a class="site-mail" href="mailto:gmt@gmt54.ru">gmt@gmt54.ru</a>
      </div>
    </header>

    <!-- ЗАГОЛОВОК -->
    <div class="header-block">
      <h2>Возврат МИ в ЛУ</h2>
      <p>Укажите ID сделки, приложите фото и комментарий — данные будут отправлены в Битрикс24.</p>
    </div>

    <div class="content">

      <!-- ID СДЕЛКИ -->
      <div class="form-section">
        <h3>📋 ID сделки</h3>
        <label for="dealId">Номер сделки в Битрикс24</label>
        <input type="text" id="dealId" inputmode="numeric" placeholder="Например: 12345" autocomplete="off">
      </div>

      <!-- ФОТО -->
      <div class="form-section">
        <h3>📷 Фотографии</h3>
        <div class="button-group">
          <button id="btnPhoto" type="button">Сделать фото</button>
          <button id="btnGallery" type="button">Из галереи</button>
        </div>
        <div id="previews"></div>
        <div id="info"></div>
      </div>

      <!-- КОММЕНТАРИЙ -->
      <div class="form-section">
        <h3>💬 Комментарий</h3>
        <label for="comment">Текст комментария</label>
        <textarea id="comment" placeholder="Введите текст комментария"></textarea>
      </div>

      <!-- ОТПРАВКА -->
      <div class="button-group">
        <button id="btnSend" type="button">Отправить в Битрикс24</button>
      </div>

      <div id="status"></div>

    </div>
  </div>
</div>

<script>
// ==== НАСТРОЙКИ ====
const WEBHOOK = "https://b24-964ige.bitrix24.ru/rest/1/v2wlsum3d4zu1ceb/";
const PORTAL = "https://b24-964ige.bitrix24.ru";
const MANAGER_ID = "240";
const MAX_SIZE = 300 * 1024;
const FIXED_PHRASE = "Возврат МИ в ЛУ";

const UF_FIELD = "UF_CRM_1791016249";
const UF_VALUE_YES = 1;

const MAX_PHOTOS = 5;

// ==== ЭЛЕМЕНТЫ ====
const $ = id => document.getElementById(id);
const dealIdEl = $("dealId");
const btnPhoto = $("btnPhoto");
const btnGallery = $("btnGallery");
const btnSend = $("btnSend");
const previewsEl = $("previews");
const info = $("info");
const status = $("status");

let photos = [];
let isProcessing = false;

// ==== ВЫБОР ФОТО ====
function pickPhoto(useCamera) {
  if (isProcessing) return;
  if (photos.length >= MAX_PHOTOS) {
    info.textContent = `Достигнут лимит: ${MAX_PHOTOS} фото`;
    return;
  }

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (useCamera) input.capture = "environment";
  input.style.display = "none";

  input.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    if (!file) {
      input.remove();
      return;
    }

    isProcessing = true;
    btnPhoto.disabled = true;
    btnGallery.disabled = true;
    info.textContent = "Обработка фото...";

    try {
      const { base64, size, name } = await compressImage(file);
      photos.push({ base64, name, size });
      renderPreviews();
      info.textContent = `Добавлено: ${name}, ~${Math.round(size / 1024)} КБ. Всего: ${photos.length}`;
    } catch (err) {
      console.error(err);
      info.textContent = "Ошибка обработки фото: " + err.message;
    } finally {
      isProcessing = false;
      btnPhoto.disabled = false;
      btnGallery.disabled = false;
      input.remove();
    }
  });

  document.body.appendChild(input);
  input.click();
}

btnPhoto.addEventListener("click", () => pickPhoto(true));
btnGallery.addEventListener("click", () => pickPhoto(false));

function renderPreviews() {
  previewsEl.innerHTML = "";
  photos.forEach((p, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "thumb";

    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + p.base64;
    img.alt = p.name;

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "✕";
    del.title = "Удалить";
    del.addEventListener("click", () => {
      photos.splice(idx, 1);
      renderPreviews();
      info.textContent = photos.length ? `Фото: ${photos.length}` : "";
    });

    wrap.appendChild(img);
    wrap.appendChild(del);
    previewsEl.appendChild(wrap);
  });
}

function compressImage(file, maxSize = MAX_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        const MAX_DIM = 1600;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round(height * MAX_DIM / width);
            width = MAX_DIM;
          } else {
            width = Math.round(width * MAX_DIM / height);
            height = MAX_DIM;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        while (dataUrl.length * 0.75 > maxSize && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }

        const base64 = dataUrl.split(",")[1];
        const size = Math.round(base64.length * 0.75);
        const name = `photo_${Date.now()}.jpg`;

        resolve({ base64, size, name });
      };
      img.onerror = () => reject(new Error("Не удалось загрузить изображение"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.readAsDataURL(file);
  });
}

// ==== ОТПРАВКА ====
btnSend.addEventListener("click", async () => {
  const dealId = dealIdEl.value.trim();
  const comment = $("comment").value.trim();

  if (!dealId) return showStatus("Укажите ID сделки", false);
  if (!comment && photos.length === 0) return showStatus("Добавьте комментарий или фото", false);
  if (isProcessing) return showStatus("Дождитесь окончания обработки фото", false);

  btnSend.disabled = true;
  showStatus("Отправка...", true);

  try {
    const fullComment = comment
      ? FIXED_PHRASE + "\n" + comment
      : FIXED_PHRASE;

    const fields = {
      ENTITY_TYPE: "deal",
      ENTITY_ID: dealId,
      COMMENT: fullComment
    };

    if (photos.length > 0) {
      fields.FILES = photos.map(p => [p.name, p.base64]);
    }

    const resp = await fetch(WEBHOOK + "crm.timeline.comment.add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    });

    const data = await resp.json();

    if (data.error) {
      showStatus("Ошибка Битрикс24: " + data.error_description, false);
      return;
    }

    let ufNote = "";
    try {
      const ufResp = await fetch(WEBHOOK + "crm.deal.update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: dealId,
          fields: { [UF_FIELD]: UF_VALUE_YES }
        })
      });
      const ufData = await ufResp.json();
      if (ufData.error) {
        console.warn("Не удалось обновить поле " + UF_FIELD + ":", ufData.error_description);
        ufNote = `\n⚠️ Поле МИ возврат не обновлено: ${ufData.error_description}`;
      } else {
        ufNote = `\n✅ Поле МИ возврат=Да`;
      }
    } catch (e) {
      console.warn("Ошибка обновления поля:", e);
      ufNote = `\n⚠️ Поле МИ возврат не обновлено: ${e.message}`;
    }

    const dealLink = `${PORTAL}/crm/deal/details/${dealId}/`;
    const notifyText = `МИ возвращено.\nСделка: ${dealLink}`;

    let notifyNote = "";
    try {
      const notifyResp = await fetch(WEBHOOK + "im.message.add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          DIALOG_ID: MANAGER_ID,
          MESSAGE: notifyText,
          URL_PREVIEW: "Y"
        })
      });
      const notifyData = await notifyResp.json();
      if (notifyData.error) {
        console.warn("Не удалось отправить уведомление:", notifyData.error_description);
        notifyNote = `\n⚠️ Уведомление не отправлено: ${notifyData.error_description}`;
      }
    } catch (e) {
      console.warn("Ошибка отправки уведомления:", e);
      notifyNote = `\n⚠️ Уведомление не отправлено: ${e.message}`;
    }

    showStatus("✅ Комментарий добавлен в сделку " + dealId + ufNote + notifyNote, true);

    photos = [];
    renderPreviews();
    info.textContent = "";
    $("comment").value = "";

  } catch (err) {
    console.error(err);
    showStatus("Сетевая ошибка: " + err.message, false);
  } finally {
    btnSend.disabled = false;
  }
});

function showStatus(text, ok) {
  status.textContent = text;
  status.className = ok ? "ok" : "err";
  status.style.display = "block";
}
</script>

</body>
</html>
