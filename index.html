<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Возврат МИ в ЛУ</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    background: #f5f6f8;
    color: #222;
    max-width: 500px;
    margin: 0 auto;
  }

  /* Шапка: логотип слева, затем заголовок */
  .header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }
  .header .logo {
    height: 40px;
    width: auto;
    flex-shrink: 0;
    display: block;
  }
  .header h1 {
    font-size: 20px;
    margin: 0;
  }

  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: 600;
  }
  #btnPhoto { background: #2fc6f6; color: #fff; }
  #btnGallery { background: #7a8bff; color: #fff; }
  #btnSend { background: #1db954; color: #fff; }
  button:disabled { opacity: 0.6; }
  #info { margin-top: 8px; font-size: 13px; color: #666; }

  /* Сетка превью */
  #previews {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .thumb {
    position: relative;
    padding-top: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #e5e7eb;
  }
  .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .del {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 26px;
    height: 26px;
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 16px;
    line-height: 26px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
  }

  #status {
    margin-top: 16px; padding: 12px; border-radius: 8px;
    font-size: 14px; display: none; white-space: pre-wrap;
  }
  .ok { background: #d4f5dd; color: #10622a; }
  .err { background: #fad4d4; color: #7a1414; }
</style>
</head>
<body>

<div class="header">
  <img class="logo"
       src="https://github.com/mironov62-svg/refund/blob/main/lpu.png?raw=true"
       alt="Логотип">
  <h1>Возврат МИ в ЛУ</h1>
</div>

<label for="dealId">ID сделки</label>
<input type="text" id="dealId" inputmode="numeric" placeholder="Например: 12345">

<button id="btnPhoto" type="button">📷 Сделать фото</button>
<button id="btnGallery" type="button">🖼 Выбрать из галереи</button>
<div id="previews"></div>
<div id="info"></div>

<label for="comment">Комментарий</label>
<textarea id="comment" placeholder="Введите текст комментария"></textarea>

<button id="btnSend" type="button">Отправить в Битрикс24</button>

<div id="status"></div>

<script>
// ==== НАСТРОЙКИ ====
const WEBHOOK = "https://b24-964ige.bitrix24.ru/rest/1/v2wlsum3d4zu1ceb/";
const PORTAL = "https://b24-964ige.bitrix24.ru";
const MANAGER_ID = "240"; // ID сотрудника для уведомления
const MAX_SIZE = 300 * 1024; // 300 КБ на файл
const FIXED_PHRASE = "Возврат МИ в ЛУ"; // первая строка комментария

// Пользовательское поле сделки, которое нужно ставить в "Да"
const UF_FIELD = "UF_CRM_1791016249";
const UF_VALUE_YES = 1; // 1 = "Да" для поля типа "Список"

// Максимум фото за раз (чтобы не превысить лимиты Битрикс24)
const MAX_PHOTOS = 5;

// ==== ЭЛЕМЕНТЫ ====
const $ = id => document.getElementById(id);
const dealIdEl = $("dealId");
const btnPhoto = $("btnPhoto");
const btnGallery = $("btnGallery");
const btnSend = $("btnSend");
const previewsEl = $("previews");
const info = $("info");
const status = $("status");

// Массив прикреплённых фото: { base64, name, size }
let photos = [];

// Флаг, что идёт обработка файла — блокирует кнопки фото
let isProcessing = false;

// ==== ВЫБОР ФОТО ====
// capture = "environment" — открыть камеру; capture = null — галерея
function pickPhoto(useCamera) {
  if (isProcessing) return;
  if (photos.length >= MAX_PHOTOS) {
    info.textContent = `Достигнут лимит: ${MAX_PHOTOS} фото`;
    return;
  }

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (useCamera) input.capture = "environment";
  input.style.display = "none";

  input.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    if (!file) {
      input.remove();
      return;
    }

    // Блокируем кнопки на время обработки
    isProcessing = true;
    btnPhoto.disabled = true;
    btnGallery.disabled = true;
    info.textContent = "Обработка фото...";

    try {
      const { base64, size, name } = await compressImage(file);
      photos.push({ base64, name, size });
      renderPreviews();
      info.textContent = `Добавлено: ${name}, ~${Math.round(size / 1024)} КБ. Всего: ${photos.length}`;
    } catch (err) {
      console.error(err);
      info.textContent = "Ошибка обработки фото: " + err.message;
    } finally {
      isProcessing = false;
      btnPhoto.disabled = false;
      btnGallery.disabled = false;
      input.remove();
    }
  });

  document.body.appendChild(input);
  input.click();
}

btnPhoto.addEventListener("click", () => pickPhoto(true));
btnGallery.addEventListener("click", () => pickPhoto(false));

// Отрисовка превью-сетки
function renderPreviews() {
  previewsEl.innerHTML = "";
  photos.forEach((p, idx) => {
    const wrap = document.createElement("div");
    wrap.className = "thumb";

    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + p.base64;
    img.alt = p.name;

    const del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "✕";
    del.title = "Удалить";
    del.addEventListener("click", () => {
      photos.splice(idx, 1);
      renderPreviews();
      info.textContent = photos.length ? `Фото: ${photos.length}` : "";
    });

    wrap.appendChild(img);
    wrap.appendChild(del);
    previewsEl.appendChild(wrap);
  });
}

// Сжатие изображения через canvas
function compressImage(file, maxSize = MAX_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        // Ограничиваем стороны (max 1600px)
        const MAX_DIM = 1600;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round(height * MAX_DIM / width);
            width = MAX_DIM;
          } else {
            width = Math.round(width * MAX_DIM / height);
            height = MAX_DIM;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        // Подбираем quality, чтобы уложиться в 300 КБ
        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        while (dataUrl.length * 0.75 > maxSize && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }

        const base64 = dataUrl.split(",")[1];
        const size = Math.round(base64.length * 0.75);
        const name = `photo_${Date.now()}.jpg`;

        resolve({ base64, size, name });
      };
      img.onerror = () => reject(new Error("Не удалось загрузить изображение"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.readAsDataURL(file);
  });
}

// ==== ОТПРАВКА ====
btnSend.addEventListener("click", async () => {
  const dealId = dealIdEl.value.trim();
  const comment = $("comment").value.trim();

  if (!dealId) return showStatus("Укажите ID сделки", false);
  if (!comment && photos.length === 0) return showStatus("Добавьте комментарий или фото", false);
  if (isProcessing) return showStatus("Дождитесь окончания обработки фото", false);

  btnSend.disabled = true;
  showStatus("Отправка...", true);

  try {
    // Фиксированная первая строка + комментарий пользователя
    const fullComment = comment
      ? FIXED_PHRASE + "\n" + comment
      : FIXED_PHRASE;

    // Формируем объект fields (Битрикс24 ожидает вложенный объект)
    const fields = {
      ENTITY_TYPE: "deal",
      ENTITY_ID: dealId,
      COMMENT: fullComment
    };

    // FILES — массив пар [имя_файла, base64_строка]
    if (photos.length > 0) {
      fields.FILES = photos.map(p => [p.name, p.base64]);
    }

    // 1) Добавляем комментарий в таймлайн сделки
    const resp = await fetch(WEBHOOK + "crm.timeline.comment.add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    });

    const data = await resp.json();

    if (data.error) {
      showStatus("Ошибка Битрикс24: " + data.error_description, false);
      return;
    }

    // 2) Обновляем пользовательское поле UF_CRM_1791016249 = Да (1)
    let ufNote = "";
    try {
      const ufResp = await fetch(WEBHOOK + "crm.deal.update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: dealId,
          fields: { [UF_FIELD]: UF_VALUE_YES }
        })
      });
      const ufData = await ufResp.json();
      if (ufData.error) {
        console.warn("Не удалось обновить поле " + UF_FIELD + ":", ufData.error_description);
        ufNote = `\n⚠️ Поле МИ возврат не обновлено: ${ufData.error_description}`;
      } else {
        ufNote = `\n✅ Поле МИ возврат=Да`;
      }
    } catch (e) {
      console.warn("Ошибка обновления поля:", e);
      ufNote = `\n⚠️ Поле МИ возврат не обновлено: ${e.message}`;
    }

    // 3) Отправляем уведомление сотруднику
    const dealLink = `${PORTAL}/crm/deal/details/${dealId}/`;
    const notifyText = `МИ возвращено.\nСделка: ${dealLink}`;

    let notifyNote = "";
    try {
      const notifyResp = await fetch(WEBHOOK + "im.message.add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          DIALOG_ID: MANAGER_ID,
          MESSAGE: notifyText,
          URL_PREVIEW: "Y"
        })
      });
      const notifyData = await notifyResp.json();
      if (notifyData.error) {
        console.warn("Не удалось отправить уведомление:", notifyData.error_description);
        notifyNote = `\n⚠️ Уведомление не отправлено: ${notifyData.error_description}`;
      }
    } catch (e) {
      console.warn("Ошибка отправки уведомления:", e);
      notifyNote = `\n⚠️ Уведомление не отправлено: ${e.message}`;
    }

    showStatus("✅ Комментарий добавлен в сделку " + dealId + ufNote + notifyNote, true);

    // Сброс формы
    photos = [];
    renderPreviews();
    info.textContent = "";
    $("comment").value = "";

  } catch (err) {
    console.error(err);
    showStatus("Сетевая ошибка: " + err.message, false);
  } finally {
    btnSend.disabled = false;
  }
});

function showStatus(text, ok) {
  status.textContent = text;
  status.className = ok ? "ok" : "err";
  status.style.display = "block";
}
</script>

</body>
</html>
