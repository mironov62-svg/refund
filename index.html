<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Возврат МИ в ЛУ</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    background: #f5f6f8;
    color: #222;
    max-width: 500px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: 600;
  }
  #btnPhoto { background: #2fc6f6; color: #fff; }
  #btnSend { background: #1db954; color: #fff; }
  button:disabled { opacity: 0.6; }
  #preview { margin-top: 10px; max-width: 100%; border-radius: 8px; display: none; }
  #info { margin-top: 8px; font-size: 13px; color: #666; }
  #status {
    margin-top: 16px; padding: 12px; border-radius: 8px;
    font-size: 14px; display: none; white-space: pre-wrap;
  }
  .ok { background: #d4f5dd; color: #10622a; }
  .err { background: #fad4d4; color: #7a1414; }
</style>
</head>
<body>

<h1>Возврат МИ в ЛУ</h1>

<label for="dealId">ID сделки</label>
<input type="text" id="dealId" inputmode="numeric" placeholder="Например: 12345">

<label>Фото (до 300 КБ)</label>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<button id="btnPhoto" type="button">📷 Сделать фото</button>
<img id="preview" alt="preview">
<div id="info"></div>

<label for="comment">Комментарий</label>
<textarea id="comment" placeholder="Введите текст комментария"></textarea>

<button id="btnSend" type="button">Отправить в Битрикс24</button>

<div id="status"></div>

<script>
// ==== НАСТРОЙКИ ====
const WEBHOOK = "https://b24-964ige.bitrix24.ru/rest/1/v2wlsum3d4zu1ceb/";
const MAX_SIZE = 300 * 1024; // 300 КБ
const FIXED_PHRASE = "Возврат МИ в ЛУ"; // первая строка комментария

// ==== ЭЛЕМЕНТЫ ====
const $ = id => document.getElementById(id);
const dealIdEl = $("dealId");
const photoInput = $("photoInput");
const btnPhoto = $("btnPhoto");
const btnSend = $("btnSend");
const preview = $("preview");
const info = $("info");
const status = $("status");

let photoBase64 = null;
let photoName = null;

// ==== ФОТО ====
btnPhoto.addEventListener("click", () => photoInput.click());

photoInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  info.textContent = "Обработка фото...";
  try {
    const { base64, size, name } = await compressImage(file);
    photoBase64 = base64;
    photoName = name;
    preview.src = "data:image/jpeg;base64," + base64;
    preview.style.display = "block";
    info.textContent = `Готово: ${name}, ~${Math.round(size / 1024)} КБ`;
  } catch (err) {
    console.error(err);
    info.textContent = "Ошибка обработки фото: " + err.message;
  }
});

// Сжатие изображения через canvas
function compressImage(file, maxSize = MAX_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        // Ограничиваем стороны (max 1600px)
        const MAX_DIM = 1600;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round(height * MAX_DIM / width);
            width = MAX_DIM;
          } else {
            width = Math.round(width * MAX_DIM / height);
            height = MAX_DIM;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        // Подбираем quality, чтобы уложиться в 300 КБ
        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        while (dataUrl.length * 0.75 > maxSize && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }

        const base64 = dataUrl.split(",")[1];
        const size = Math.round(base64.length * 0.75);
        const name = `photo_${Date.now()}.jpg`;

        resolve({ base64, size, name });
      };
      img.onerror = () => reject(new Error("Не удалось загрузить изображение"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.readAsDataURL(file);
  });
}

// ==== ОТПРАВКА ====
btnSend.addEventListener("click", async () => {
  const dealId = dealIdEl.value.trim();
  const comment = $("comment").value.trim();

  if (!dealId) return showStatus("Укажите ID сделки", false);
  if (!comment && !photoBase64) return showStatus("Добавьте комментарий или фото", false);

  btnSend.disabled = true;
  showStatus("Отправка...", true);

  try {
    // Фиксированная первая строка + комментарий пользователя
    const fullComment = comment
      ? FIXED_PHRASE + "\n" + comment
      : FIXED_PHRASE;

    // Формируем объект fields (Битрикс24 ожидает вложенный объект)
    const fields = {
      ENTITY_TYPE: "deal",
      ENTITY_ID: dealId,
      COMMENT: fullComment
    };

    // FILES — массив пар [имя_файла, base64_строка]
    if (photoBase64) {
      fields.FILES = [[photoName, photoBase64]];
    }

    const resp = await fetch(WEBHOOK + "crm.timeline.comment.add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    });

    const data = await resp.json();

    if (data.error) {
      showStatus("Ошибка Битрикс24: " + data.error_description, false);
    } else {
      showStatus("✅ Комментарий добавлен в сделку " + dealId, true);
      // Сброс формы
      photoBase64 = null;
      photoName = null;
      preview.style.display = "none";
      photoInput.value = "";
      info.textContent = "";
      $("comment").value = "";
    }
  } catch (err) {
    console.error(err);
    showStatus("Сетевая ошибка: " + err.message, false);
  } finally {
    btnSend.disabled = false;
  }
});

function showStatus(text, ok) {
  status.textContent = text;
  status.className = ok ? "ok" : "err";
  status.style.display = "block";
}
</script>

</body>
</html>
